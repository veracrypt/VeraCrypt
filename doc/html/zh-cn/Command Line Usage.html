<h1>命令行使用</h1>
<p>VeraCrypt 在 Windows 和类 Unix 系统上使用不同的命令行语法。请选择与您的操作系统匹配的页面：</p>
<ul>
<li><a href="Command%20Line%20Usage%20for%20Windows.html">Windows 命令行使用</a></li>
<li><a href="Command%20Line%20Usage%20for%20Unix.html">Linux 和 macOS 命令行使用</a></li>
</ul>
<p>在 Linux 和 macOS 上，还可以在终端中使用以下命令显示已安装 VeraCrypt 版本的命令行帮助：</p>
<p><code>veracrypt -t --help</code></p>
